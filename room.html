<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>가평 풍차펜션 - 객실안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="가평 풍차펜션 - 객실안내" />
  <meta property="og:description" content="가평 풍차펜션에서 넓은 테라스와 시원한 수영장, 바베큐장을 함께 즐기며 단체 여행에 딱 맞는 여유롭고 특별한 하루를 완성해보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/tM1pnjiClcA0.jpg" />
  <meta property="og:url" content="https://windmillhill.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="가평 풍차펜션 - 객실안내" />
  <meta name="twitter:description" content="가평 풍차펜션에서 넓은 테라스와 시원한 수영장, 바베큐장을 함께 즐기며 단체 여행에 딱 맞는 여유롭고 특별한 하루를 완성해보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/tM1pnjiClcA0.jpg" />
  <meta name="naver-site-verification" content="2665c84480890364fe88dda9e931a0eb51d5e7ae" />
  <meta name="google-site-verification" content="ubsG-9pfPEjhj0u6BWNkSKTabSGMUizJmj0Dgm1838w" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 room.html?room_id= (객실 상세). ?room_id= 없으면 첫 번째 객실을 보여준다.
             백오피스 preview 는 ?id= 로 보내므로 둘 다 받는다. -->
        <section id="content" class="sub2_2 sub_room sub_room_detail">
          <div class="sub_visual_wide visual">
            <div class="sub_visual_box">
              <div class="swiper-container">
                <!-- data-* 속성 : data-room-hero-slides | 동적 매핑 필요
                     roomtypes[current].images (category=roomtype_interior) 전체 -->
                <div class="swiper-wrapper" data-room-hero-slides></div>
                <div class="swiper-button-prev"><img src="images/arrow_left.png" alt="prev" /></div>
                <div class="swiper-button-next"><img src="images/arrow_right.png" alt="next" /></div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cont">
            <div class="view_cate_box">
              <div class="sub_title">
                <!-- data-* 속성 : data-room-name -->
                <h3 data-room-name></h3>
                <span>WELCOME TO PENSION</span>
              </div>
              <div class="sub_cate_wrap">
                <!-- data-* 속성 : data-room-list-nav | 동적 매핑 필요
                     customFields.roomtypes[] → "미리보기" li 뒤에 객실 li 추가 (현재 객실 .on) -->
                <ul data-room-list-nav>
                  <li><a href="./layout-map.html">미리보기</a></li>
                  <!-- MAPPER: roomtypes[] 동적 생성 -->
                </ul>
              </div>
            </div>

            <div class="sub_inner">
              <div class="table_box">
                <!-- PC 표 -->
                <div class="price_table for_pc">
                  <table cellspacing="0" cellpadding="0" class="table_default">
                    <thead>
                      <tr>
                        <th style="width: 15%">객실명</th>
                        <th style="width: 5%">기준</th>
                        <th style="width: 5%">최대</th>
                        <th style="width: 20%">유형</th>
                        <th style="width: 20%">평형</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <!-- data-* 속성 : data-room-name / -base-occupancy / -max-occupancy
                             / -structure / -size-pyeong -->
                        <td data-room-name></td>
                        <td data-room-base-occupancy></td>
                        <td data-room-max-occupancy></td>
                        <td data-room-structure></td>
                        <td data-room-size-pyeong></td>
                      </tr>
                    </tbody>
                  </table>
                  <ul class="table_text">
                    <li>
                      <strong>집기품목</strong>
                      :
                      <!-- data-* 속성 : data-room-amenities (rooms[j].amenities.join(', ')) -->
                      <span data-room-amenities></span>
                    </li>
                  </ul>
                </div>

                <!-- 모바일 표 (평형 열 없음) -->
                <div class="price_table for_m">
                  <table cellspacing="0" cellpadding="0" class="table_default">
                    <tbody>
                      <tr>
                        <td>객실명</td>
                        <td>기준</td>
                        <td>최대</td>
                        <td>유형</td>
                      </tr>
                      <tr>
                        <td data-room-name></td>
                        <td data-room-base-occupancy></td>
                        <td data-room-max-occupancy></td>
                        <td data-room-structure></td>
                      </tr>
                    </tbody>
                  </table>
                  <ul class="table_text">
                    <li>
                      <strong>집기품목</strong>
                      :
                      <span data-room-amenities></span>
                    </li>
                  </ul>
                </div>

                <div class="btn_wrap">
                  <!-- data-* 속성 : data-booking-url (property.realtimeBookingId) -->
                  <a href="#!" target="_blank" class="btn_reserve" data-booking-url>예약하기</a>
                </div>
              </div>
            </div>

            <div class="sub_txt_box">
              <div class="sub_title sub_inner">
                <span data-room-detail-eyebrow>Memories Pension</span>
                <h3 data-room-detail-title>Rooms Detail</h3>
                <!-- data-* 속성 : pages.room[current].sections[0].hero.title / .description -->
                <p data-room-detail-description></p>
              </div>
              <div class="box sub_inner">
                <div class="img"><img alt="객실 이미지" data-room-detail-main-image /></div>
                <div class="txt">
                  <!-- ⚠️ `src` 를 비워 두지 않는다. `src=""` 는 브라우저가 현재 페이지를 다시 요청한다.
                       매퍼가 채우기 전까지 속성 자체를 두지 않는다. -->
                  <img alt="객실 이미지" data-room-detail-side-image />
                  <span data-room-detail-copy></span>
                  <a href="#!" target="_blank" class="btn_reserve" data-booking-url>→&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;예약하기</a>
                </div>
              </div>
            </div>

            <div class="sub_img_box">
              <!-- data-* 속성 : data-room-quad-images | 동적 매핑 필요
                   roomtype_interior 중 최대 4장만 노출 -->
              <ul class="sub_inner" data-room-quad-images>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
              </ul>
            </div>

            <!-- s: 와이드 1장 — 원본 .sub_img_box 직계 <img>.
                 이 영역이 없는 사이트(dbff)도 있어 이미지가 없으면 통째로 숨긴다. -->
            <div class="sub_img_box sub_inner" data-room-wide-section>
              <!-- data-* 속성 : data-room-wide-image | roomtype_exterior[6] -->
              <img alt="객실 이미지" data-room-wide-image />
            </div>
            <!--// 와이드 -->

            <!-- s: 객실 평면도 — 원본 객실 상세의 평면도 영역 크롤링 이미지가 있을 때만 노출 -->
            <div class="room_floorplan" data-room-floorplan-section>
              <div class="sub_inner">
                <div class="sub_title2">
                  <h3>객실 평면도</h3>
                </div>
                <div class="floorplan_img">
                  <!-- data-* 속성 : data-room-floorplan-image
                       roomtypes[current] 평면도 크롤링 이미지 → 없으면 섹션 미노출 -->
                  <img alt="객실 평면도" data-room-floorplan-image />
                </div>
              </div>
            </div>
            <!--// 객실 평면도 -->

            <!-- s: main_room — 객실 미리보기 슬라이더 (index / layout-map 과 동일 구조) -->
            <div class="main_room">
              <div class="room_list">
                <div class="main_title sub_inner">
                  <span data-index-eyebrow>WELCOME TO PENSION</span>
                  <h3 data-index-room-title>Room Preview</h3>
                  <!-- data-* 속성 : data-index-room-description (index.essence.description — index 와 같은 소스) -->
                  <p data-index-room-description></p>
                </div>
                <div class="room_sld_wrap">
                  <div class="swiper-container room_list_sld">
                    <!-- data-* 속성 : data-room-list-slides | 동적 매핑 필요
                         customFields.roomtypes[] × rooms[] id 매칭 -->
                    <div class="swiper-wrapper" data-room-list-slides></div>
                  </div>
                </div>
              </div>
            </div>
            <!--// main_room -->
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/parallax.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/room-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/room.js"></script>
  </body>
</html>
